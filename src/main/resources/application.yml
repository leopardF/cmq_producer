
server:
  port: 5622
  servlet:
    context-path: /api/v1

spring:
  main:
    allow-bean-definition-overriding: true
  aop:
    controller: com.leopard.producer

mq:
  tencent:
    nameServerAddress: http://127.0.0.1
    secretId: 10000
    secretKey: 1377
    maxMsgHeapNum: -1 #最大堆积消息数，默认 -1
    pollingWaitSeconds: 0 #消息接收长轮询等待时间, 默认0
    visibilityTimeout: 30 #消息可见性超时 默认30
    maxMsgSize: 默认1048576 #消息最大长度，取值范围1024-1048576 Byte（即1-1024K），单位字节 默认1048576（topic模式下只有此项生效）
    msgRetentionSeconds: 345600 #消息保留周期，单位秒，默认345600，即4天
    createTime: -1 #队列创建时间，默认 -1
    lastModifyTime: -1 #队列属性最后修改时间，默认 -1
    activeMsgNum: -1 #队列处于Active状态的消息总数，默认 -1
    inactiveMsgNum: -1 #队列处于Inactive状态的消息总数，默认 -1
  send:
    queue: QUEUE_xxxx
    topic: TOPIC_xxxx